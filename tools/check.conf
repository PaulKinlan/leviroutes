# tools/check.conf — installed as ~/.fleet/check.conf on this project's VM.
# Project: leviroutes (/home/exedev/leviroutes)
#
# Sourced by bin/fleet-check.
# Full gate: merger only, runs build, package export verification, full suite (R1, budget <= 300s).
# Fast gate: implementer only, affected-only suites via suite-map.tsv (R2, budget <= 60s).
CHECK_CMD="bash tools/full-gate.sh"
CHECK_TIMEOUT=300
CHECK_FAST_CMD="bash tools/fast-gate.sh"
CHECK_FAST_TIMEOUT=60
CHECK_FAST_PASS_RE='^fast-gate: PASS \([1-9][0-9]* suite\(s\), [0-9]+ changed file\(s\)\)$'
# Exactly the line tools/fast-gate.sh prints when every changed file is exempt (docs, licence,
# CI metadata, static demo pages — see tools/suite-map.tsv). Kept narrow on purpose: this regex,
# not the map alone, is what lets a no-work run count as a PASS below.
CHECK_FAST_NO_WORK_RE='^fast-gate: no suites affected by [0-9]+ changed file\(s\) \([0-9]+ exempt\)$'
# Without this, fleet-check treats a no-work run as a non-verdict ('unknown' is the default) and
# every docs-only change has to spend a merger full-gate slot to land.
CHECK_FAST_NO_WORK_POLICY=pass
CHECK_FAST_COVERAGE_REQUIRED=1
CHECK_FAST_CONTRACT_OWNER="/home/exedev/leviroutes/.git"
